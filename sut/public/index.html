<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orders \u2014 DX E2E reference application</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <strong>Billing console</strong>
    <span id="whoami" data-state="loading">\u2014</span>
    <a href="/login.html" id="signout">Sign out</a>
  </header>

  <main>
    <section class="card">
      <h1>Orders</h1>
      <p class="hint">Data is fetched asynchronously and painted after a deferred render step.</p>
      <table>
        <thead>
          <tr><th>Item</th><th>Status</th><th class="num">Amount</th><th></th></tr>
        </thead>
        <tbody id="orders-body" data-state="loading">
          <tr class="skeleton"><td colspan="4">Loading orders\u2026</td></tr>
        </tbody>
        <tfoot>
          <tr><th colspan="2">Total</th><th class="num" id="orders-total" data-state="loading">\u2014</th><th></th></tr>
        </tfoot>
      </table>
      <div class="row">
        <input id="new-item" placeholder="New order item" />
        <button id="add-order">Add order</button>
        <span id="filter-open" class="chip">Open only</span>
        <span id="filter-all" class="chip active">All</span>
      </div>
    </section>

    <section class="card">
      <h2>Settings</h2>
      <label>Theme
        <select id="theme">
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label>Notifications
        <select id="notifications">
          <option value="on">on</option>
          <option value="off">off</option>
        </select>
      </label>
      <button id="save-settings">Save settings</button>
      <span id="settings-status" data-state="idle"></span>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
